<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2e7d5b" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EcoAccion" />
  <title>EcoAccion — Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body class="pagina-login">
  <main class="login-contenedor">
    <section class="login-tarjeta" aria-labelledby="titulo-login">
      <div class="marca-login" aria-hidden="true">🌱</div>
      <p class="nombre-app">EcoAccion</p>
      <h1 id="titulo-login">Bienvenido de nuevo</h1>
      <p class="texto-login">Ingresa para seguir sumando acciones por el planeta.</p>

      <div id="aviso-login" class="aviso-login" role="alert" aria-live="polite"></div>

      <form id="form-login" novalidate>
        <div class="campo" id="campo-correo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            placeholder="nombre@correo.com"
            autocomplete="email"
            required
          />
          <div class="error-campo" id="error-correo"></div>
        </div>

        <div class="campo" id="campo-contrasena">
          <label for="contrasena">Contraseña</label>
          <div class="campo-contrasena">
            <input
              type="password"
              id="contrasena"
              name="contrasena"
              placeholder="Mínimo 4 caracteres"
              autocomplete="current-password"
              required
            />
            <button type="button" id="alternar-contrasena" class="ver-contrasena" aria-label="Mostrar contraseña">
              Ver
            </button>
          </div>
          <div class="error-campo" id="error-contrasena"></div>
        </div>

        <label class="recordarme">
          <input type="checkbox" id="recordarme" />
          <span>Recordarme en este equipo</span>
        </label>

        <button type="submit" class="boton-primario" id="btn-login">
          Iniciar sesión
        </button>
      </form>

      <p class="enlace-registro">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </p>

      <p class="nota-demo">
        Cuenta de demostración: <strong>demo@eco.com</strong> / contraseña <strong>1234</strong>.
      </p>
    </section>
  </main>

  <script src="js/api-local.js"></script>
  <script src="js/login.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
