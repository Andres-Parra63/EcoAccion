<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoAccion — Registrar acción</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="telefono">
    <!-- HU03: Registrar acción sostenible -->
    <header class="encabezado">
      <h1>Registrar acción</h1>
      <button type="button" class="cerrar-sesion" data-cerrar-sesion>Salir</button>
    </header>

    <!-- Aviso de éxito/error (notifica al usuario, criterio HU03) -->
    <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

    <main class="contenido">
      <form id="form-accion" novalidate>
        <!-- HU04: la categoría se elige en un selector visual -->
        <div class="campo" id="campo-categoria">
          <label for="abrir-categorias">Tipo de acción</label>
          <input type="hidden" id="categoria" name="categoria" />
          <button
            type="button"
            id="abrir-categorias"
            class="selector-categoria"
            aria-haspopup="dialog"
          >
            <span id="categoria-seleccionada">Seleccionar tipo</span>
            <span aria-hidden="true">›</span>
          </button>
          <div class="error-campo" id="error-categoria"></div>
        </div>

        <!-- Fecha -->
        <div class="campo" id="campo-fecha">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" />
          <div class="error-campo" id="error-fecha"></div>
        </div>

        <!-- Descripción (máx. 200) -->
        <div class="campo" id="campo-descripcion">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" maxlength="200"
                    placeholder="Describe tu acción..."></textarea>
          <div class="contador"><span id="contador">0</span>/200</div>
          <div class="error-campo" id="error-descripcion"></div>
        </div>

        <button type="submit" class="boton-primario" id="btn-guardar">
          Guardar acción
        </button>
      </form>
    </main>

    <dialog id="dialogo-categorias" class="dialogo-categorias" aria-labelledby="titulo-categorias">
      <form method="dialog" class="panel-categorias">
        <header class="encabezado encabezado-dialogo">
          <button type="button" id="cerrar-categorias" class="boton-icono" aria-label="Cerrar">←</button>
          <h2 id="titulo-categorias">Tipo de acción</h2>
        </header>
        <div id="lista-categorias" class="lista-categorias" role="radiogroup" aria-label="Tipos de acción">
          <p class="cargando">Cargando tipos de acción...</p>
        </div>
        <div class="pie-dialogo">
          <button type="button" id="confirmar-categoria" class="boton-primario" disabled>Confirmar</button>
        </div>
      </form>
    </dialog>

    <!-- Navegación inferior -->
    <nav class="nav-inferior">
      <a href="registrar.html" class="activo"><span class="icono">➕</span>Registrar</a>
      <a href="historial.html"><span class="icono">📋</span>Historial</a>
      <a href="ranking.html"><span class="icono">🏆</span>Ranking</a>
      <a href="impacto.html"><span class="icono">📊</span>Impacto</a>
    </nav>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/registrar.js"></script>
</body>
</html>
