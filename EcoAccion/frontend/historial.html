<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2e7d5b" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EcoAccion" />
  <title>EcoAccion — Mi historial</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="telefono">
    <header class="encabezado">
      <a class="flecha" href="registrar.html" title="Volver">&larr;</a>
      <h1>Mi historial</h1>
      <button type="button" class="cerrar-sesion" data-cerrar-sesion>Salir</button>
    </header>

    <main class="contenido">
      <div id="resumen-historial" class="resumen-historial" hidden></div>
      <div id="aviso-historial" class="aviso aviso-historial" role="status" aria-live="polite"></div>
      <ul id="lista-historial" class="lista-historial" aria-label="Acciones sostenibles registradas">
        <li class="cargando">Cargando historial...</li>
      </ul>
      <div id="historial-vacio" class="estado-vacio" hidden>
        <p>Aún no has registrado acciones sostenibles.</p>
        <a class="boton-primario boton-enlace" href="registrar.html">Registrar una acción</a>
      </div>
    </main>

    <nav class="nav-inferior">
      <a href="registrar.html"><span class="icono">➕</span>Registrar</a>
      <a href="historial.html" class="activo"><span class="icono">📋</span>Historial</a>
      <a href="retos.html"><span class="icono">🎯</span>Retos</a>
      <a href="ranking.html"><span class="icono">🏆</span>Ranking</a>
      <a href="impacto.html"><span class="icono">📊</span>Impacto</a>
      <a href="gestionar.html"><span class="icono">⚙️</span>Gestión</a>
    </nav>
  </div>

  <script src="js/api-local.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/historial.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
